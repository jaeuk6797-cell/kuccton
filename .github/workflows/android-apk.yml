# Android APK 자동 빌드
# android/ 또는 앱 설정이 바뀌면 APK를 만들어 고정 링크에 올린다.
#   https://github.com/jaeuk6797-cell/kuccton/releases/download/android-latest/sup.apk
# 화면·기능 같은 웹 코드는 앱이 Vercel 배포본을 불러오므로 다시 설치할 필요가 없다.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 의존성 설치
        run: npm ci

      # 앱은 Vercel 배포본을 불러오지만, 혹시 모를 오프라인 대비로 웹 빌드도 넣어 둔다
      - name: 웹 빌드
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_EMOTION_API_URL: ${{ vars.VITE_EMOTION_API_URL }}

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../sup.apk

      - name: 다운로드용 Actions 아티팩트
        uses: actions/upload-artifact@v4
        with:
          name: sup-apk
          path: sup.apk

      - name: 고정 링크(android-latest 릴리스)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="main ${GITHUB_SHA::7} 빌드 · $(TZ=Asia/Seoul date '+%m/%d %H:%M')

          폰에서 sup.apk를 받아 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱 설치'를 허용해야 합니다."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTE"
          else
            gh release create android-latest --title "소리숲 Android 최신 빌드" --notes "$NOTE" --prerelease
          fi
          gh release upload android-latest sup.apk --clobber
